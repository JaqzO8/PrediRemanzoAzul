name: CI/CD Pipeline - Test & Deploy to AWS EC2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Pruebas Automatizadas y Validación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Pruebas Unitarias e Integración
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing

  deploy:
    name: 🚀 Despliegue Automatizado a AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Desplegar a AWS EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "==== Iniciando actualización en el servidor EC2 ===="
            APP_DIR="/opt/prediremanzoazul"
            
            # Si el directorio no existe aún, clonar el repositorio
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R "$USER:$USER" "$APP_DIR"
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
              cd "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master
            fi

            # Si no existe .env, crearlo desde .env.example
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            # Levantar con Docker Compose
            echo "==== Construyendo y levantando contenedores Docker ===="
            docker compose down --remove-orphans || true
            docker compose up -d --build

            # Comprobar salud del servicio
            echo "==== Verificando estado de salud de la aplicación ===="
            sleep 8
            curl -f http://localhost:8080/health || (echo "Healthcheck falló!" && exit 1)
            echo "==== ✅ Despliegue completado con éxito ===="
